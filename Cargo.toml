[package]
name = "ergmx"
version = "0.4.0"
edition = "2024"
# The oldest Rust that builds ergmx; rust-toolchain.toml pins the one used.
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.12"
rustc-hash = "2.1"

[profile.release]
codegen-units = 1
lto = "fat"
