[package]
name = "ergmx"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
rayon = "1.12"
rustc-hash = "2.1"

[profile.release]
codegen-units = 1
lto = "fat"
