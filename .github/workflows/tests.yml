# Runs the test suites on every push to main and every pull request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true
    - name: Install the Rust toolchain of rust-toolchain.toml
      run: rustup toolchain install
    - name: Build ergmx and install the development dependencies
      run: uv sync --locked
    - name: Test
      run: uv run pytest

  lowest:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
    - name: Install the Rust toolchain of rust-toolchain.toml
      run: rustup toolchain install
    - name: Install ergmx with the oldest versions its requirements allow
      run: |
        uv venv --python 3.11
        uv pip install --resolution lowest-direct . "pytest>=8" "igraph>=0.11.5" "networkx>=3.2" "matplotlib>=3.9" "pandas>=2.0"
    - name: Test
      run: .venv/bin/python -m pytest

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # The Rust tests link to libpython, which this Python provides.
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install the Rust toolchain of rust-toolchain.toml
      run: rustup toolchain install
    - name: Clippy
      run: cargo clippy --release --all-targets -- -D warnings
    - name: Test
      run: cargo test --release
