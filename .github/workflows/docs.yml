# This workflow builds the documentation with Sphinx and publishes it to GitHub Pages
# For more information see: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        enable-cache: true
    - name: Install the Rust toolchain of rust-toolchain.toml
      run: rustup toolchain install
    - name: Build ergmx and install the documentation tools
      run: uv sync --locked --group docs
    - name: Build documentation
      run: uv run sphinx-build -W --keep-going -d docs/_build/doctrees docs docs/_build/html
    - name: Upload documentation
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  # Pull requests only check that the documentation builds.
  deploy:

    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
